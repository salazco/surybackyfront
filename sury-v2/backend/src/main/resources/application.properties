spring.application.name=sury-backend
server.port=8080

# Base de datos H2 en archivo (se crea en ./data). Cambia a PostgreSQL/MySQL cuando lo necesites.
spring.datasource.url=jdbc:h2:file:./data/sury
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Origenes permitidos (frontend)
sury.cors.allowed-origins=http://localhost:5173,http://localhost:3000
